name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run format:check

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx electron-builder --win --x64 --publish never
      - name: verify windows artifacts
        shell: pwsh
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          $productName = $package.build.productName
          $version = $package.version
          $expectedArtifacts = @(
            "release/$productName Setup $version.exe"
            "release/$productName Portable $version.exe"
          )
          $missingArtifacts = $expectedArtifacts | Where-Object {
            -not (Test-Path -LiteralPath $_ -PathType Leaf)
          }
          if ($missingArtifacts) {
            throw "Missing Windows artifacts: $($missingArtifacts -join ', ')"
          }
